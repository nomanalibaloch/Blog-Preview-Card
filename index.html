<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Figtree:300,regular,500,700,800" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <main>
            <div class="card">
                <img src="./assets/images/illustration-article.svg" alt="">
                <h4>Learning</h4>
                <p class="published-date">Published 21 Dec 2023</p>
                <h2 tabindex="0">HTML & CSS foundations</h2>
                <p class="para">These languages are the backbone of every website, defining structure, content, and presentation.</p>
                <div class="profile">
                    <img src="./assets/images/image-avatar.webp" alt="">
                    <p>Greg Hooper</p>
                </div>
            </div>
        </main>
          <footer class="attribution">
                Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
                Coded by <a href="#">Noman Gorchani</a>.
          </footer>
    </div>
</body>
</html>
